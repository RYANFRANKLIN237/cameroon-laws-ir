<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Drafting — LexAfrique</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/drafting.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary)',
                        secondary: 'var(--secondary)',
                        accent: 'var(--accent)',
                        muted: 'var(--muted)',
                        'muted-foreground': 'var(--muted-foreground)',
                    },
                    borderRadius: { 'xl': 'var(--radius)' }
                }
            }
        }
    </script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#F8F9FA] h-screen overflow-hidden flex flex-col font-sans"
    x-data="draftingApp()" x-init="init()"
    @keydown.escape.window="closeTemplate()">

    <div class="page-enter flex flex-col h-full min-h-0">

        <!-- ── HEADER ─────────────────────────────────────────────── -->
        <header class="bg-white border-b border-gray-200 shadow-sm shrink-0">
            <div class="px-4 py-4 flex items-center gap-3">
                <a href="/search"
                    class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-[#007A5E]/10 transition-colors shrink-0">
                    <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
                </a>
                <div>
                    <h2 class="text-xl font-bold text-[#007A5E] leading-tight">Legal Drafting</h2>
                    <p class="text-xs text-gray-400">Professional legal document templates for African jurisdictions</p>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-hidden flex min-h-0">

            <!-- ── CATEGORY SIDEBAR ───────────────────────────────── -->
            <aside class="w-56 bg-white border-r border-gray-200 shrink-0 overflow-y-auto hidden md:block">
                <div class="p-4">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Categories</p>
                    <nav class="space-y-1">
                        <template x-for="cat in categories" :key="cat.id">
                            <button type="button" @click="activeCategory = cat.id"
                                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors text-left"
                                :class="activeCategory === cat.id
                                    ? 'bg-[#007A5E]/10 text-[#007A5E] font-semibold'
                                    : 'text-gray-800 hover:bg-gray-100'">
                                <span :class="activeCategory === cat.id ? 'text-[#007A5E]' : 'text-gray-400'">
                                    <i :data-lucide="cat.icon" class="w-4 h-4"></i>
                                </span>
                                <span class="truncate" x-text="cat.label"></span>
                                <span class="ml-auto text-xs text-gray-400"
                                    x-text="categoryCount(cat.id)"></span>
                            </button>
                        </template>
                    </nav>
                </div>
            </aside>

            <!-- ── MAIN ───────────────────────────────────────────── -->
            <main class="flex-1 overflow-y-auto px-4 sm:px-6 py-6">

                <div class="relative max-w-xl mb-5">
                    <i data-lucide="search"
                        class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"></i>
                    <input type="text" x-model="searchQuery" placeholder="Search templates…"
                        class="drafting-search w-full pl-9 pr-4 py-2.5 text-sm rounded-full border border-gray-200
                               bg-white focus:border-[#007A5E] shadow-sm transition">
                </div>

                <!-- Mobile category chips -->
                <div class="md:hidden category-scroll flex gap-2 overflow-x-auto pb-4 mb-2">
                    <template x-for="cat in categories" :key="'m-' + cat.id">
                        <button type="button" @click="activeCategory = cat.id"
                            class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold
                                   border transition-colors"
                            :class="activeCategory === cat.id
                                ? 'bg-[#007A5E]/10 text-[#007A5E] border-[#007A5E]/25'
                                : 'bg-white text-gray-600 border-gray-200'">
                            <span x-text="cat.label"></span>
                            <span class="text-[10px] opacity-70" x-text="categoryCount(cat.id)"></span>
                        </button>
                    </template>
                </div>

                <div x-show="!loaded" class="flex flex-col items-center justify-center py-24">
                    <span class="scale-loader scale-loader--lg" aria-hidden="true">
                        <span class="scale-loader-dot"></span>
                        <span class="scale-loader-beam">
                            <i data-lucide="scale" class="w-12 h-12 text-[#007A5E]"></i>
                        </span>
                        <span class="scale-loader-dot scale-loader-dot--opp"></span>
                    </span>
                    <p class="text-sm text-gray-400 mt-5 font-medium">Loading templates…</p>
                </div>

                <div x-show="loaded" x-cloak>

                    <!-- Most Used -->
                    <section x-show="showMostUsed" class="mb-8">
                        <div class="flex items-center gap-2 mb-4">
                            <i data-lucide="star" class="w-4 h-4 star-popular"></i>
                            <h3 class="text-base font-semibold text-gray-900">Most Used</h3>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                            <template x-for="(t, i) in popular" :key="'pop-' + t.id">
                                <button type="button" @click="openTemplate(t)"
                                    class="template-card text-left bg-white rounded-2xl border border-gray-200 p-5
                                           hover:shadow-md hover:border-[#007A5E]/30 transition-all group"
                                    :style="`animation-delay: ${i * 40}ms`">
                                    <div class="flex items-start justify-between mb-3">
                                        <div class="w-10 h-10 rounded-xl bg-[#007A5E]/10 flex items-center justify-center">
                                            <i data-lucide="file-signature" class="w-5 h-5 text-[#007A5E]"></i>
                                        </div>
                                        <i data-lucide="star" class="w-4 h-4 star-popular"></i>
                                    </div>
                                    <p class="font-semibold text-sm text-gray-900 leading-tight mb-1.5
                                              group-hover:text-[#007A5E] transition-colors"
                                        x-text="t.title"></p>
                                    <p class="text-xs text-gray-400 leading-relaxed line-clamp-2 mb-3"
                                        x-text="t.description"></p>
                                    <div class="flex items-center justify-between">
                                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border"
                                            :class="complexityClass(t.complexity)"
                                            x-text="t.complexity"></span>
                                        <span class="text-[10px] text-gray-400" x-text="`${t.estimatedPages}p`"></span>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </section>

                    <!-- All / filtered -->
                    <section>
                        <div class="flex items-center gap-2 mb-4">
                            <template x-if="showMostUsed">
                                <i data-lucide="clock" class="w-4 h-4 text-gray-400"></i>
                            </template>
                            <h3 class="text-base font-semibold text-gray-900">
                                <span x-text="showMostUsed ? 'All Templates' : sectionTitle"></span>
                                <span x-show="!showMostUsed"
                                    class="ml-2 text-sm text-gray-400 font-normal"
                                    x-text="`(${filtered.length})`"></span>
                            </h3>
                        </div>

                        <div x-show="filtered.length === 0" class="text-center py-16 text-gray-400">
                            <i data-lucide="file-text" class="w-10 h-10 mx-auto mb-3 opacity-30"></i>
                            <p class="text-sm">No templates found for "<span x-text="searchQuery"></span>"</p>
                        </div>

                        <div x-show="filtered.length > 0"
                            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                            <template x-for="(t, i) in filtered" :key="t.id">
                                <button type="button" @click="openTemplate(t)"
                                    class="template-card text-left bg-white rounded-2xl border border-gray-200 p-5
                                           hover:shadow-md hover:border-[#007A5E]/30 transition-all group"
                                    :style="`animation-delay: ${i * 40}ms`">
                                    <div class="flex items-start justify-between mb-3">
                                        <div class="w-10 h-10 rounded-xl bg-[#007A5E]/10 flex items-center justify-center">
                                            <i data-lucide="file-signature" class="w-5 h-5 text-[#007A5E]"></i>
                                        </div>
                                        <i x-show="t.popular" data-lucide="star" class="w-4 h-4 star-popular"></i>
                                    </div>
                                    <p class="font-semibold text-sm text-gray-900 leading-tight mb-1.5
                                              group-hover:text-[#007A5E] transition-colors"
                                        x-text="t.title"></p>
                                    <p class="text-xs text-gray-400 leading-relaxed line-clamp-2 mb-3"
                                        x-text="t.description"></p>
                                    <div class="flex items-center justify-between">
                                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border"
                                            :class="complexityClass(t.complexity)"
                                            x-text="t.complexity"></span>
                                        <span class="text-[10px] text-gray-400" x-text="`${t.estimatedPages}p`"></span>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <!-- ── TEMPLATE DETAIL DRAWER ─────────────────────────────────── -->
    <div x-show="selectedTemplate" x-cloak class="fixed inset-0 z-[80]">
        <div class="absolute inset-0 bg-black/30"
            x-show="selectedTemplate"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            @click="closeTemplate()"></div>

        <aside class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col"
            x-show="selectedTemplate"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="translate-x-full"
            x-transition:enter-end="translate-x-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="translate-x-0"
            x-transition:leave-end="translate-x-full"
            @click.stop>

            <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-200 shrink-0">
                <button type="button" @click="closeTemplate()"
                    class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-gray-100 transition-colors">
                    <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
                </button>
                <span class="font-semibold text-gray-900">Template Details</span>
            </div>

            <template x-if="selectedTemplate">
                <div class="flex-1 overflow-y-auto px-6 py-6 min-h-0">
                    <div class="w-14 h-14 rounded-2xl bg-[#007A5E]/10 flex items-center justify-center mb-5">
                        <i data-lucide="file-signature" class="w-7 h-7 text-[#007A5E]"></i>
                    </div>

                    <span x-show="selectedTemplate.popular"
                        class="inline-flex items-center gap-1 text-xs font-semibold text-gray-800
                               bg-[#FCD116]/25 px-2 py-0.5 rounded-full mb-3">
                        <i data-lucide="star" class="w-3 h-3 star-popular"></i>
                        Popular
                    </span>

                    <h2 class="text-xl font-bold text-gray-900 mb-2" x-text="selectedTemplate.title"></h2>
                    <p class="text-sm text-gray-500 leading-relaxed mb-6"
                        x-text="selectedTemplate.description"></p>

                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-gray-50 rounded-xl p-4">
                            <p class="text-xs text-gray-400 mb-1">Complexity</p>
                            <span class="text-xs font-semibold px-2 py-0.5 rounded-full border"
                                :class="complexityClass(selectedTemplate.complexity)"
                                x-text="selectedTemplate.complexity"></span>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-4">
                            <p class="text-xs text-gray-400 mb-1">Est. Length</p>
                            <p class="text-sm font-semibold text-gray-900"
                                x-text="`${selectedTemplate.estimatedPages} pages`"></p>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-4 col-span-2">
                            <p class="text-xs text-gray-400 mb-2">Available In</p>
                            <div class="flex gap-2">
                                <template x-for="lang in selectedTemplate.languages" :key="lang">
                                    <span class="text-xs font-semibold bg-[#007A5E]/10 text-[#007A5E] px-2 py-0.5 rounded-full"
                                        x-text="lang"></span>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="bg-[#FCD116]/10 border border-[#FCD116]/30 rounded-xl p-4 text-xs text-gray-800 leading-relaxed">
                        <strong>Disclaimer:</strong> These templates are starting points. Always review with a qualified lawyer before signing or filing.
                    </div>
                </div>
            </template>

            <div class="px-6 py-5 border-t border-gray-200 space-y-3 shrink-0">
                <button type="button" @click="useTemplate()"
                    class="w-full bg-[#007A5E] hover:brightness-110 text-white font-semibold rounded-full
                           px-4 py-3 flex items-center gap-2 transition-all">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    Use this Template
                    <i data-lucide="chevron-right" class="w-4 h-4 ml-auto"></i>
                </button>
                <button type="button" @click="downloadTemplate()"
                    class="w-full border border-[#007A5E]/30 text-[#007A5E] font-semibold rounded-full
                           px-4 py-3 flex items-center justify-center gap-2 hover:bg-[#007A5E]/5 transition-all">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    Download (DOCX)
                </button>
                <p x-show="downloadNotice" x-cloak class="text-[11px] text-gray-400 text-center"
                    x-text="downloadNotice"></p>
            </div>
        </aside>
    </div>

    <script src="{{ url_for('static', filename='js/drafting.js') }}"></script>
</body>

</html>
