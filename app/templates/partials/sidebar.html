<!-- ── SIDEBAR DRAWER ─────────────────────────────────────────── -->
<div x-show="showSidebar" x-cloak class="fixed inset-0 z-[90]">
    <div class="absolute inset-0 bg-black/40"
        x-show="showSidebar"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        @click="showSidebar = false"></div>

    <aside class="absolute left-0 top-0 h-full w-80 bg-white shadow-2xl flex flex-col"
        x-show="showSidebar"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="-translate-x-full"
        x-transition:enter-end="translate-x-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="translate-x-0"
        x-transition:leave-end="-translate-x-full"
        @click.stop>

        <div class="flex items-center justify-between px-5 py-5 border-b border-gray-200">
            <div class="flex items-center gap-3">
                <i data-lucide="scale" class="w-6 h-6 text-[#007A5E]"></i>
                <span class="font-semibold text-[#007A5E]">Legal Tools</span>
            </div>
            <button type="button" @click="showSidebar = false"
                class="text-gray-400 hover:text-gray-700 transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <nav class="flex-1 px-3 py-6 space-y-1 overflow-y-auto">
            <template x-for="feature in sidebarFeatures" :key="feature.label">
                <button type="button" @click="handleSidebarFeature(feature.action)"
                    class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 transition-colors
                           flex items-center gap-4 group active:scale-[0.98]">
                    <i :data-lucide="feature.icon" class="w-5 h-5 text-gray-700 shrink-0"></i>
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-sm text-gray-900 leading-tight" x-text="feature.label"></p>
                        <p class="text-xs text-gray-400 mt-0.5 leading-relaxed" x-text="feature.description"></p>
                    </div>
                </button>
            </template>
        </nav>

        <div class="px-5 py-4 border-t border-gray-200">
            <p class="text-xs text-gray-400 text-center">More tools coming soon</p>
        </div>
    </aside>
</div>
